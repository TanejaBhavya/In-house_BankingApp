<div class="update-card">
  
  <h2>Update Contact</h2>

  <form>
    <div class="form-group">
      <label>Email</label>
      <input type="email" placeholder="Enter new email">
    </div>

    <div class="form-group">
      <label>Phone</label>
      <input type="text" placeholder="Enter phone number">
    </div>

    <button class="update-btn">Update</button>
  </form>
</div>
